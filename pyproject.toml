[project]
name = "charactergenerator"
dynamic = ["version"]
description = "Generates Characters from user tables"
readme = "README.md"
authors = [
    { name = "vdbma", email = "vandenbossche.marc@hotmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pyperclip>=1.11.0",
    "rich>=15.0.0",
    "setuptools-scm>=10.3.4",
]

[project.scripts]
char-gen = "charactergenerator.cli:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
