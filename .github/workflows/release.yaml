name: Release
on:
  push:
    tags:
    - v* # format M.m.p

jobs:
  build-lib:
    name: Build lib package
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10   # v3.0.2

  pypi-publish:
    name: Upload release to PyPI
    needs: [build-lib]
    runs-on: ubuntu-latest
    environment:
      name: charactergenerator
      url: https://pypi.org/p/CharacterGenerator
    permissions:
      id-token: write
    steps:
    - name: Download distributions
      uses: actions/download-artifact@v8
      with:
        name: artifacts-charactergenerator
        path: dist

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.3
